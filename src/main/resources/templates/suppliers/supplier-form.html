<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Редакция на доставчик' : 'Нов доставчик'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{header :: header-fragment}"></div>

    <div class="main-container">
        <div th:replace="~{sidebar :: sidebar-fragment}"></div>

        <section class="content new-order-page supplier-form-page">

            <div class="content-header">
                <h1 class="page-title-blue"
                    th:text="${isEdit} ? 'Редакция на доставчик' : 'Нов доставчик'">
                </h1>

                <a th:href="@{/suppliers}" class="btn-new-order">
                    Назад
                </a>
            </div>

            <p th:if="${errorMessage}"
               th:text="${errorMessage}"
               class="error-message">
            </p>

            <div class="table-container">
                <form th:object="${supplierForm}"
                      th:action="${isEdit} ? @{/suppliers/{id}(id=${supplierId})} : @{/suppliers}"
                      method="post">

                    <div class="item-row">
                        <div class="item-fields">

                            <div class="item-field">
                                <label>Име на фирма</label>
                                <input type="text"
                                       th:field="*{companyName}"
                                       class="status-select"
                                       required>
                            </div>

                            <div class="item-field">
                                <label>ЕИК</label>
                                <input type="text"
                                       th:field="*{eik}"
                                       class="status-select">
                            </div>

                            <div class="item-field">
                                <label>ДДС номер</label>
                                <input type="text"
                                       th:field="*{vat}"
                                       class="status-select">
                            </div>

                            <div class="item-field">
                                <label>МОЛ</label>
                                <input type="text"
                                       th:field="*{mol}"
                                       class="status-select">
                            </div>

                            <div class="item-field">
                                <label>Телефон</label>
                                <input type="text"
                                       th:field="*{phone}"
                                       class="status-select">
                            </div>

                            <div class="item-field">
                                <label>Имейл</label>
                                <input type="email"
                                       th:field="*{email}"
                                       class="status-select">
                            </div>

                            <div class="item-field">
                                <label>Адрес</label>
                                <input type="text"
                                       th:field="*{address}"
                                       class="status-select">
                            </div>

                            <div class="item-field">
                                <label>Бележка</label>
                                <textarea th:field="*{note}"
                                          class="status-select"
                                          rows="3"></textarea>
                            </div>

                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-new-order"
                                th:text="${isEdit} ? 'Запази промените' : 'Добави доставчик'">
                        </button>
                    </div>

                </form>
            </div>
        </section>
    </div>
</div>
</body>
</html>
