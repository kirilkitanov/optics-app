<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Редакция на клиент' : 'Нов клиент'">Клиент</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-wrapper">

    <div th:replace="~{header :: header-fragment}"></div>

    <div class="main-container">

        <div th:replace="~{sidebar :: sidebar-fragment}"></div>

        <section class="content new-order-page product-form-page">

            <div class="content-header">
                <h1 class="page-title-blue"
                    th:text="${isEdit} ? 'Редакция на клиент' : 'Нов клиент'">
                    Клиент
                </h1>

                <a th:href="@{/customers}" class="btn-new-order">Назад</a>
            </div>

            <div class="table-container">

                <form th:object="${customerForm}"
                      th:action="${isEdit} ? @{/customers/{id}(id=${customerId})} : @{/customers}"
                      method="post">

                    <div class="item-row">

                        <div class="item-fields">

                            <div class="item-field">
                                <label for="fullName">Име и фамилия</label>
                                <input id="fullName"
                                       type="text"
                                       th:field="*{fullName}"
                                       class="status-select"
                                       required>
                            </div>

                            <div class="item-field">
                                <label for="phone">Телефон</label>
                                <input id="phone"
                                       type="text"
                                       th:field="*{phone}"
                                       class="status-select"
                                       required>
                            </div>

                            <div class="item-field">
                                <label for="city">Град</label>
                                <input id="city"
                                       type="text"
                                       th:field="*{city}"
                                       class="status-select">
                            </div>

                            <div class="item-field">
                                <label for="email">Имейл</label>
                                <input id="email"
                                       type="email"
                                       th:field="*{email}"
                                       class="status-select">
                            </div>

                            <div class="item-field customer-note-field">
                                <label for="note">Бележка</label>
                                <textarea id="note"
                                          th:field="*{note}"
                                          class="status-select"
                                          maxlength="500"
                                          rows="2"
                                          placeholder="Допълнителна информация..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-new-order"
                                th:text="${isEdit} ? 'Запази промените' : 'Създай клиент'">
                            Запази
                        </button>
                    </div>

                </form>

            </div>

        </section>
    </div>
</div>

</body>
</html>
