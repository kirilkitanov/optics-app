<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детайли за клиент</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{header :: header-fragment}"></div>

    <div class="main-container">
        <div th:replace="~{sidebar :: sidebar-fragment}"></div>

        <section class="content">
            <div class="content-header">
                <h1 class="page-title-blue">Поръчки и плащания</h1>

                <a th:href="@{/customers}" class="btn-new-order">
                    Назад
                </a>
            </div>

            <div th:if="${successMessage}"
                 th:text="${successMessage}"
                 class="success-message">
            </div>

            <div th:if="${errorMessage}"
                 th:text="${errorMessage}"
                 style="color: red; margin-bottom: 12px;">
            </div>

            <div class="customer-details">
                <h2 th:text="${customer.fullName}">Име на клиента</h2>

                <p>
                    <strong>Телефон:</strong>
                    <span th:text="${customer.phone}"></span>
                </p>

                <p>
                    <strong>Град:</strong>
                    <span th:text="${customer.city}"></span>
                </p>

                <p>
                    <strong>Имейл:</strong>
                    <span th:text="${customer.email}"></span>
                </p>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>Номер</th>
                        <th>Дата</th>
                        <th>Статус</th>
                        <th>Обща сума</th>
                        <th>Платено</th>
                        <th>Остатък</th>
                        <th>Плащане</th>
                        <th>История на плащанията</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="summary : ${orderSummaries}">
                        <td th:text="${summary.order.orderNumber}"></td>

                        <td th:text="${#temporals.format(
                            summary.order.createdOn, 'dd.MM.yyyy'
                        )}"></td>

                        <td th:text="${summary.order.status.displayName}"></td>

                        <td th:text="${#numbers.formatDecimal(summary.order.total, 1, 'POINT', 2, 'POINT') + ' eur'}"></td>

                        <td th:text="${#numbers.formatDecimal(summary.paid, 1, 'POINT', 2, 'POINT') + ' eur'}"></td>

                        <td th:text="${#numbers.formatDecimal(summary.outstanding, 1, 'POINT', 2, 'POINT') + ' eur'}"
                            th:classappend="${summary.outstanding > 0} ? 'status-cancelled' : ''"></td>

                        <td>
                            <button type="button"
                                    class="btn-table-action"
                                    th:if="${summary.outstanding != null and summary.outstanding.compareTo(T(java.math.BigDecimal).ZERO) != 0}"
                                    th:attr="data-order-id=${summary.order.id},
                 data-order-number=${summary.order.orderNumber},
                 data-order-total=${summary.order.total},
                 data-paid=${summary.paid},
                 data-outstanding=${summary.outstanding},
                 data-cancelled=${summary.order.status.name() == 'CANCELLED'}"
                                    onclick="openPaymentModal(this)">
                                <span th:if="${summary.order.status.name() != 'CANCELLED'}">Ново</span>
                                <span th:if="${summary.order.status.name() == 'CANCELLED'}">Върни сума</span>
                            </button>

                        </td>

                        <td>
                            <div th:if="${#lists.isEmpty(paymentsByOrder[summary.order.id])}">
                                Няма плащания
                            </div>


                            <div th:each="payment : ${paymentsByOrder[summary.order.id]}"
                                 style="margin-bottom: 8px;">

                                <strong th:text="${payment.amount}"></strong>
                                <strong> eur</strong>
                                <span>,</span>
                                <span th:text="${payment.paymentMethod.displayName + ','}"></span>
                                <span th:text="${#temporals.format(payment.paymentDate, 'dd.MM.yyyy HH:mm')}"></span>
                                <br>

                                <div class="payment-history-actions">
    <span class="payment-created-by">
        Въвел:
        <span th:text="${payment.createdBy.username}"></span>
    </span>

                                    <div class="payment-action-buttons">
                                        <button type="button"
                                                class="payment-icon-button"
                                                title="Редакция на плащането"
                                                aria-label="Редакция на плащането"
                                                th:attr="data-payment-id=${payment.id},
                         data-order-id=${summary.order.id},
                         data-order-number=${summary.order.orderNumber},
                         data-order-total=${summary.order.total},
                         data-paid=${summary.paid},
                         data-outstanding=${summary.outstanding},
                         data-amount=${payment.amount},
                         data-method=${payment.paymentMethod.name()}"
                                                onclick="openEditPaymentModal(this)">
                                            ✎
                                        </button>

                                        <form method="post"
                                              th:action="@{/customers/{customerId}/orders/{orderId}/payments/{paymentId}/delete(
                  customerId=${customer.id},
                  orderId=${summary.order.id},
                  paymentId=${payment.id})}"
                                              onsubmit="return confirm('Сигурни ли сте, че искате да изтриете плащането?');">

                                            <input type="hidden"
                                                   th:name="${_csrf.parameterName}"
                                                   th:value="${_csrf.token}">

                                            <button type="submit"
                                                    class="payment-icon-button payment-delete-button"
                                                    title="Изтрий плащането"
                                                    aria-label="Изтрий плащането">
                                                ×
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>

                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(orderSummaries)}">
                        <td colspan="8">
                            Няма активни поръчки за този клиент.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </section>
    </div>
</div>

<div id="paymentModal" class="modal" style="display: none;" aria-hidden="true">
    <div class="modal-content">
        <h3 id="paymentModalTitle">Добавяне на плащане</h3>

        <p>Клиент: <strong id="paymentCustomerName"></strong></p>
        <p>Поръчка №: <strong id="paymentOrderNumber"></strong></p>
        <p>Обща сума: <strong id="paymentOrderTotal"></strong> eur</p>
        <p>Платено: <strong id="paymentAlreadyPaid"></strong> eur</p>
        <p>Остатък: <strong id="paymentOutstanding"></strong> eur</p>

        <form id="paymentForm"
              method="post"
              th:attr="data-customer-id=${customer.id}">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <label for="paymentAmount">Сума на плащането (eur)</label>
            <input id="paymentAmount"
                   type="number"
                   name="amount"
                   step="0.01"
                   required>

            <label for="paymentMethod">Начин на плащане</label>
            <select id="paymentMethod" name="paymentMethod" required>
                <option value="CASH">В брой</option>
                <option value="BANK">По банка</option>
            </select>

            <button type="submit" class="btn-table-action" id="paymentSubmitButton">
                Запиши
            </button>

            <button type="button"
                    class="btn-table-action"
                    onclick="closePaymentModal()">
                Отказ
            </button>
        </form>
    </div>
</div>

<script>


    function openPaymentModal(button) {
        const modal = document.getElementById('paymentModal');
        const form = document.getElementById('paymentForm');
        const cancelled = button.dataset.cancelled === 'true';

        document.getElementById('paymentCustomerName').textContent =
            document.querySelector('.page-title-blue').textContent.trim();

        document.getElementById('paymentOrderNumber').textContent =
            button.dataset.orderNumber;

        document.getElementById('paymentOrderTotal').textContent =
            formatAmount(button.dataset.orderTotal);

        document.getElementById('paymentAlreadyPaid').textContent =
            formatAmount(button.dataset.paid);

        document.getElementById('paymentOutstanding').textContent =
            formatAmount(button.dataset.outstanding);

        form.action = '/customers/' + form.dataset.customerId
            + '/orders/' + button.dataset.orderId + '/payments';

        document.getElementById('paymentModalTitle').textContent =
            cancelled ? 'Връщане на пари' : 'Добавяне на плащане';

        document.getElementById('paymentSubmitButton').textContent = 'Запиши';

        document.getElementById('paymentAmount').value = '';
        document.getElementById('paymentMethod').value = 'CASH';

        modal.style.display = 'flex';
        modal.setAttribute('aria-hidden', 'false');
        document.getElementById('paymentAmount').focus();
    }

    function openEditPaymentModal(button) {
        const modal = document.getElementById('paymentModal');
        const form = document.getElementById('paymentForm');

        document.getElementById('paymentCustomerName').textContent =
            document.querySelector('.page-title-blue').textContent.trim();

        document.getElementById('paymentOrderNumber').textContent =
            button.dataset.orderNumber;

        document.getElementById('paymentOrderTotal').textContent =
            formatAmount(button.dataset.orderTotal);

        document.getElementById('paymentAlreadyPaid').textContent =
            formatAmount(button.dataset.paid);

        document.getElementById('paymentOutstanding').textContent =
            formatAmount(button.dataset.outstanding);

        form.action = '/customers/' + form.dataset.customerId
            + '/orders/' + button.dataset.orderId
            + '/payments/' + button.dataset.paymentId + '/edit';

        document.getElementById('paymentModalTitle').textContent =
            'Редакция на плащане';

        document.getElementById('paymentSubmitButton').textContent =
            'Запази промените';

        document.getElementById('paymentAmount').value =
            button.dataset.amount;

        document.getElementById('paymentMethod').value =
            button.dataset.method;

        modal.style.display = 'flex';
        modal.setAttribute('aria-hidden', 'false');
        document.getElementById('paymentAmount').focus();
    }


    function closePaymentModal() {
        const modal = document.getElementById('paymentModal');

        modal.style.display = 'none';
        modal.setAttribute('aria-hidden', 'true');
    }

    function formatAmount(value) {
        const amount = Number(value);
        return Number.isFinite(amount) ? amount.toFixed(2) : '0.00';
    }

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
            closePaymentModal();
        }
    });

    document.getElementById('paymentModal').addEventListener(
        'click',
        function (event) {
            if (event.target === this) {
                closePaymentModal();
            }
        }
    );
</script>


</body>
</html>
