
<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клиенти</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{header :: header-fragment}"></div>

    <div class="main-container">
        <div th:replace="~{sidebar :: sidebar-fragment}"></div>

        <section class="content">

            <div class="content-header">
                <h1 class="page-title-blue">Клиенти</h1>

                <form class="order-search-form" onsubmit="return false;">
                    <input type="text"
                           id="customerSearch"
                           class="order-search-input"
                           placeholder="име на клиент или телефон"
                           autocomplete="off">

                    <button type="button"
                            class="btn-new-order"
                            onclick="filterCustomers()">
                        Търси
                    </button>
                </form>

                <form class="order-search-form" onsubmit="return false;">
                    <select id="customerFilter" class="order-search-input">
                        <option value="all">Всички клиенти</option>
                        <option value="debtors">Само длъжници</option>
                        <option value="no-debt">Без задължения</option>
                    </select>
                </form>

                <a th:href="@{/customers/new}" class="btn-new-order">
                    Нов клиент
                </a>
            </div>

            <p th:if="${successMessage}"
               th:text="${successMessage}"
               class="success-message">
            </p>

            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>Име</th>
                        <th>Телефон</th>
                        <th>Град</th>
                        <th>Имейл</th>
                        <th>Сума</th>
                        <th>Платени</th>
                        <th>Дължими</th>
                        <th>Преглед</th>
                        <th>Редакция</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr class="customer-row"
                        th:each="summary : ${summaries}"
                        th:attr="data-outstanding=${summary.outstanding},
                                 data-name=${summary.customer.fullName},
                                 data-phone=${summary.customer.phone}">

                        <td th:text="${summary.customer.fullName}"></td>
                        <td th:text="${summary.customer.phone}"></td>
                        <td th:text="${summary.customer.city}"></td>
                        <td th:text="${summary.customer.email}"></td>

                        <td th:text="${#numbers.formatDecimal(summary.totalOrders, 1, 'POINT', 2, 'POINT') + ' eur'}"></td>
                        <td th:text="${#numbers.formatDecimal(summary.paid, 1, 'POINT', 2, 'POINT') + ' eur'}"></td>
                        <td th:text="${#numbers.formatDecimal(summary.outstanding, 1, 'POINT', 2, 'POINT') + ' eur'}"
                            th:classappend="${summary.outstanding > 0} ? 'status-cancelled' : ''"></td>

                        <td>
                            <a th:href="@{/customers/{id}(id=${summary.customer.id})}"
                               class="btn-table-action">
                                Отвори
                            </a>
                        </td>

                        <td>
                            <a th:href="@{/customers/{id}/edit(id=${summary.customer.id})}"
                               class="btn-table-action">
                                Редакция
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(summaries)}">
                        <td colspan="9">Няма добавени клиенти.</td>
                    </tr>
                    <tr id="noCustomerResults" hidden>
                        <td colspan="8" class="empty-table-message">
                            Няма клиенти, отговарящи на търсенето.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const searchInput = document.getElementById('customerSearch');
        const customerFilter = document.getElementById('customerFilter');

        searchInput.addEventListener('input', filterCustomers);
        customerFilter.addEventListener('change', filterCustomers);

        filterCustomers();
    });

    function filterCustomers() {
        const searchInput = document.getElementById('customerSearch');
        const customerFilter = document.getElementById('customerFilter');

        const search = searchInput.value.trim().toLocaleLowerCase('bg');
        const filter = customerFilter.value;

        const rows = Array.from(document.querySelectorAll('.customer-row'));
        let visibleCount = 0;

        rows.forEach(function (row) {
            const name = (row.dataset.name || '').toLocaleLowerCase('bg');
            const phone = (row.dataset.phone || '').toLocaleLowerCase('bg');
            const outstanding = Number(row.dataset.outstanding || 0);

            const matchesSearch =
                name.includes(search) || phone.includes(search);

            let matchesFilter = true;

            if (filter === 'debtors') {
                matchesFilter = outstanding > 0;
            } else if (filter === 'no-debt') {
                matchesFilter = outstanding <= 0;
            }

            row.hidden = !(matchesSearch && matchesFilter);

            if (!row.hidden) {
                visibleCount++;
            }
        });

        const noResults = document.getElementById('noCustomerResults');
        noResults.hidden = rows.length === 0 || visibleCount > 0;
    }
</script>

</body>
</html>
