<!DOCTYPE html>
<html lang="bg" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нова поръчка</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class="app-wrapper">

    <div th:replace="~{header :: header-fragment}"></div>

    <div class="main-container">

        <div th:replace="~{sidebar :: sidebar-fragment}"></div>

        <section class="content">

            <div class="content-header">
                <h1 class="page-title-blue"
                    th:text="${order != null ? 'Редакция на поръчка ' + order.orderNumber : 'Нова поръчка'}">
                    Нова поръчка
                </h1>
                <a th:href="@{/orders}" class="btn-new-order">Назад</a>
            </div>

            <div class="table-container">

                <form th:action="${order != null} ? @{/orders/{id}/edit(id=${order.id})} : @{/orders/new}"
                      method="POST">
                    <!-- CLIENT -->
                    <div class="form-group">
                        <label class="form-label">Клиент *</label>

                        <div style="display:flex; gap:10px; align-items:center;">

                            <select id="customerSelect" name="customerId" class="status-select" required>
                                <option value="">-- Избери клиент --</option>

                                <option th:each="c : ${customers}"
                                        th:value="${c.id}"
                                        th:text="${c.fullName + ' - ' + c.phone}"
                                        th:selected="${createOrderRequest.customerId == c.id}">
                                </option>
                            </select>

                            <button type="button" class="btn-new-order" onclick="openCustomerModal()">
                                + Нов
                            </button>

                        </div>
                    </div>

                    <h3 class="section-title">Спецификация</h3>

                    <div id="prescriptionItems">

                        <div class="item-row"
                             th:each="item, itemStat : ${createOrderRequest.items}">

                            <div class="item-header">
                                <strong>Продукт 1</strong>
                            </div>

                            <!-- ОСНОВНИ ДАННИ -->
                            <div class="item-fields">

                                <div class="item-field">
                                    <label>Категория</label>
                                    <select th:name="'items[' + ${itemStat.index} + '].category'"
                                            class="status-select category-trigger"
                                            onchange="toggleFieldsByCategory(this)">
                                        <option value="LENS"
                                                th:selected="${item.category == T(com.opticsappbg.opticsapp.product.model.ProductCategory).LENS}">
                                            Стъкла
                                        </option>
                                        <option value="FRAME"
                                                th:selected="${item.category == T(com.opticsappbg.opticsapp.product.model.ProductCategory).FRAME}">
                                            Рамка
                                        </option>
                                        <option value="SUNGLASSES"
                                                th:selected="${item.category == T(com.opticsappbg.opticsapp.product.model.ProductCategory).SUNGLASSES}">
                                            Слънчеви
                                        </option>
                                        <option value="CONTACT_LENS"
                                                th:selected="${item.category == T(com.opticsappbg.opticsapp.product.model.ProductCategory).CONTACT_LENS}">
                                            Контактни лещи
                                        </option>
                                        <option value="ACCESSORY"
                                                th:selected="${item.category == T(com.opticsappbg.opticsapp.product.model.ProductCategory).ACCESSORY}">
                                            Аксесоар
                                        </option>
                                    </select>
                                </div>

                                <div class="item-field">
                                    <label>Баркод</label>
                                    <input type="text"
                                           th:name="'items[' + ${itemStat.index} + '].barcode'"
                                           th:value="${item.barcode}"
                                           class="status-select barcode-input"
                                           placeholder="Сканирай"
                                           oninput="autoFillByBarcode(this)">
                                </div>

                                <div class="item-field">
                                    <label>Бранд</label>
                                    <input type="text"
                                           th:name="'items[' + ${itemStat.index} + '].brand'"
                                           th:value="${item.brand}"
                                           class="status-select brand-input"
                                           list="brandSuggestions"
                                           oninput="updateModelsForCurrentRow(this)">
                                </div>

                                <div class="item-field">
                                    <label>Модел</label>
                                    <input type="text"
                                           th:name="'items[' + ${itemStat.index} + '].model'"
                                           th:value="${item.model}"
                                           class="status-select model-input"
                                           list="modelSuggestions"
                                           onfocus="filterModelsForCurrentRow(this)">
                                </div>

                                <div class="item-field">
                                    <label>Диаметър / Размер</label>
                                    <input type="text"
                                           th:name="'items[' + ${itemStat.index} + '].sizeOrDiameter'"
                                           th:value="${item.sizeOrDiameter}"
                                           class="status-select">
                                </div>

                                <div class="item-field">
                                    <label>Количество</label>
                                    <input type="number"
                                           th:name="'items[' + ${itemStat.index} + '].quantity'"
                                           th:value="${item.quantity}"
                                           class="status-select">
                                </div>

                                <div class="item-field">
                                    <label>Цена</label>
                                    <input type="number"
                                           step="0.01"
                                           th:name="'items[' + ${itemStat.index} + '].priceAtPurchase'"
                                           th:value="${item.priceAtPurchase}"
                                           class="status-select"
                                           required>
                                </div>

                            </div>

                            <!-- ПАРАМЕТРИ НА СТЪКЛОТО -->
                            <div class="diopter-section">

                                <div class="diopter-title">
                                    Параметри
                                </div>

                                <div class="item-fields">

                                    <div class="item-field">
                                        <label>Око</label>
                                        <select th:name="'items[' + ${itemStat.index} + '].eyeSide'"
                                                class="status-select">
                                            <option value="NONE"
                                                    th:selected="${item.eyeSide == T(com.opticsappbg.opticsapp.order.model.EyeSide).NONE}">
                                                --
                                            </option>
                                            <option value="LEFT"
                                                    th:selected="${item.eyeSide == T(com.opticsappbg.opticsapp.order.model.EyeSide).LEFT}">
                                                Ляво
                                            </option>
                                            <option value="RIGHT"
                                                    th:selected="${item.eyeSide == T(com.opticsappbg.opticsapp.order.model.EyeSide).RIGHT}">
                                                Дясно
                                            </option>
                                        </select>
                                    </div>

                                    <div class="item-field">
                                        <label>SPH</label>
                                        <input type="number"
                                               step="0.25"
                                               th:name="'items[' + ${itemStat.index} + '].sph'"
                                               th:value="${item.sph}"
                                               class="status-select">
                                    </div>

                                    <div class="item-field">
                                        <label>CYL</label>
                                        <input type="number"
                                               step="0.25"
                                               th:name="'items[' + ${itemStat.index} + '].cyl'"
                                               th:value="${item.cyl}"
                                               class="status-select">
                                    </div>

                                    <div class="item-field">
                                        <label>ADD</label>
                                        <input type="number"
                                               step="0.25"
                                               th:name="'items[' + ${itemStat.index} + '].addPower'"
                                               th:value="${item.addPower}"
                                               class="status-select">
                                    </div>

                                    <div class="item-field">
                                        <label>PRISM</label>
                                        <input type="number"
                                               step="0.1"
                                               th:name="'items[' + ${itemStat.index} + '].prism'"
                                               th:value="${item.prism}"
                                               class="status-select">
                                    </div>

                                    <div class="item-field">
                                        <label>AXIS</label>
                                        <input type="number"
                                               th:name="'items[' + ${itemStat.index} + '].axis'"
                                               th:value="${item.axis}"
                                               class="status-select"
                                               oninput="makeAxisCyclic(this)">
                                    </div>

                                    <div class="item-field">
                                        <label>BASE</label>
                                        <input type="text"
                                               th:name="'items[' + ${itemStat.index} + '].prismBase'"
                                               th:value="${item.prismBase}"
                                               class="status-select">
                                    </div>

                                </div>

                            </div>

                            <div class="item-actions">
                                <button type="button"
                                        onclick="removeRow(this)"
                                        class="btn-open">
                                    Премахни
                                </button>
                            </div>

                        </div>

                    </div>

                    <!-- DATALISTS -->
                    <datalist id="brandSuggestions">
                        <option th:each="b : ${brands}" th:value="${b}"></option>
                    </datalist>

                    <datalist id="modelSuggestions">
                    </datalist>

                    <button type="button" id="addRowBtn" class="btn-new-order">Добави ред</button>
                    <!-- TOTALS -->
                    <div class="financial-box">

                        <div class="financial-group">
                            <label>Общо</label>
                            <input type="number" step="0.01" name="totalBeforeDiscount" readonly value="0">
                        </div>

                        <div class="financial-group">
                            <label>Отстъпка %</label>
                            <input type="number" step="0.01" name="discountPercentage" value="0">
                        </div>

                        <div class="financial-group">
                            <label>Крайна сума</label>
                            <input type="number" step="0.01" name="total">
                        </div>

                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-new-order">Запази</button>
                    </div>

                </form>

            </div>

        </section>
    </div>
</div>

<script>
    document.getElementById('addRowBtn').addEventListener('click', function () {

        const container = document.getElementById('prescriptionItems');
        const rows = container.querySelectorAll('.item-row');
        const index = rows.length;

        const newRow = rows[0].cloneNode(true);

        newRow.querySelectorAll('input, select').forEach(el => {

            if (el.name) {
                const field = el.name.split('.').pop();
                el.name = `items[${index}].${field}`;
            }

            if (el.tagName === 'INPUT') {

                if (el.name.endsWith('.quantity')) {
                    el.value = '1';
                } else {
                    el.value = '';
                }
            }

            if (el.tagName === 'SELECT') {
                el.selectedIndex = 0;
            }
        });

        newRow.querySelector('.item-header strong').textContent =
            `Продукт ${index + 1}`;

        container.appendChild(newRow);

        toggleFieldsByCategory(
            newRow.querySelector('.category-trigger')
        );

        recalcBaseTotal();
    });


    function removeRow(btn) {

        const container = document.getElementById('prescriptionItems');
        const rows = container.querySelectorAll('.item-row');

        if (rows.length > 1) {

            btn.closest('.item-row').remove();

            // Преиндексиране
            container.querySelectorAll('.item-row').forEach((row, i) => {

                row.querySelector('.item-header strong').textContent =
                    `Продукт ${i + 1}`;

                row.querySelectorAll('input, select').forEach(el => {

                    if (el.name) {
                        const field = el.name.split('.').pop();
                        el.name = `items[${i}].${field}`;
                    }

                });
            });

            recalcBaseTotal();

        } else {

            alert('Формата трябва да съдържа поне един продукт!');
        }
    }
</script>

<script>
    function getBaseTotal() {
        return parseFloat(document.querySelector('input[name="totalBeforeDiscount"]').value || 0);
    }

    function setTotal(value) {
        document.querySelector('input[name="total"]').value = value.toFixed(2);
    }

    function setDiscount(value) {
        document.querySelector('input[name="discountPercentage"]').value = value.toFixed(2);
    }

    // При промяна на % отстъпка -> изчислява Крайна сума
    document.querySelector('input[name="discountPercentage"]').addEventListener('input', function () {
        const base = getBaseTotal();
        const discount = parseFloat(this.value || 0);
        const total = base - (base * discount / 100);
        setTotal(total);
    });
    // При промяна на Крайна сума -> изчислява % отстъпка
    document.querySelector('input[name="total"]').addEventListener('input', function () {
        const base = getBaseTotal();
        const total = parseFloat(this.value || 0);

        if (base <= 0) {
            setDiscount(0);
            return;
        }

        const discount = ((base - total) / base) * 100;
        setDiscount(discount);
    });

    // Основна функция за преизчисляване на Общата сума
    function recalcBaseTotal() {
        let rows = document.querySelectorAll('.item-row');
        let baseTotal = 0;

        rows.forEach(row => {
            let qty = parseFloat(row.querySelector('input[name$=".quantity"]')?.value || 0);
            let price = parseFloat(row.querySelector('input[name$=".priceAtPurchase"]')?.value || 0);
            baseTotal += qty * price;
        });
        // Записваме сумата преди отстъпка
        document.querySelector('input[name="totalBeforeDiscount"]').value = baseTotal.toFixed(2);
        // Фикс против безкраен цикъл: Взимаме текущия процент и преизчисляваме директно
        const currentDiscount = parseFloat(document.querySelector('input[name="discountPercentage"]').value || 0);
        const finalTotal = baseTotal - (baseTotal * currentDiscount / 100);

        setTotal(finalTotal);

        return baseTotal;
    }
    document.addEventListener("DOMContentLoaded", function () {
        recalcBaseTotal();
    });
    // Слушател за промени в количествата и цените по редовете
    document.addEventListener("input", function (e) {
        if (
            e.target.name?.includes("quantity") ||
            e.target.name?.includes("priceAtPurchase")
        ) {
            recalcBaseTotal();
        }
    });
</script>

<div id="customerModal" class="modal" style="display:none;">
    <div class="modal-content">

        <h3>Нов клиент</h3>

        <label>Име</label>
        <input type="text" id="newCustomerName" class="status-select">

        <label>Телефон</label>
        <input type="text" id="newCustomerPhone" class="status-select">

        <div style="margin-top:15px; display:flex; gap:10px;">
            <button type="button" class="btn-new-order" onclick="saveCustomer()">Запази</button>
            <button type="button" class="btn-open" onclick="closeCustomerModal()">Отказ</button>
        </div>

    </div>
</div>

<script>
    function openCustomerModal() {
        document.getElementById("customerModal").style.display = "flex";
    }

    function closeCustomerModal() {
        document.getElementById("customerModal").style.display = "none";
    }
</script>

<script>
    function saveCustomer() {
        const name = document.getElementById("newCustomerName").value.trim();
        const phone = document.getElementById("newCustomerPhone").value.trim();

        if (!name || !phone) {
            alert("Моля, попълнете име и телефон!");
            return;
        }
        // 1. Извличане на CSRF токените от мета таговете на страницата
        const token = document.querySelector("meta[name='_csrf']").getAttribute("content");
        const header = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

        fetch("/customers/quick-create", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                [header]: token // 2. Изпращане на CSRF токена към сървъра
            },
            body: JSON.stringify({
                name: name,
                phoneNumber: phone
            })
        })
            .then(res => {
                if (!res.ok) {
                    throw new Error("Сървърът отхвърли заявката със статус: " + res.status);
                }
                return res.json();
            })
            .then(data => {
                const select = document.getElementById("customerSelect");
                const option = document.createElement("option");
                option.value = data.id;
                option.text = data.name + " - " + data.phoneNumber;

                select.appendChild(option);
                select.value = data.id;
                // 3. Сега вече полетата ще се изчистят успешно
                document.getElementById("newCustomerName").value = "";
                document.getElementById("newCustomerPhone").value = "";

                closeCustomerModal();
            })
            .catch(err => {
                console.error(err);
                alert("Възникна грешка при записването на клиента.");
            });
    }
</script>

<script>
    function toggleFieldsByCategory(selectElement) {
        const row = selectElement.closest('.item-row');
        const selectedValue = selectElement.value;

        const diopterSection = row.querySelector('.diopter-section');

        if (selectedValue === 'LENS' || selectedValue === 'CONTACT_LENS') {
            diopterSection.classList.remove('hidden-field');
        } else {
            diopterSection.classList.add('hidden-field');
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('.category-trigger').forEach(select => {
            toggleFieldsByCategory(select);
        });
    });
</script>

<script>
    function makeAxisCyclic(input) {
        let value = parseInt(input.value);

        if (isNaN(value)) return;

        if (value > 180) {
            input.value = 0;
        } else if (value < 0) {
            input.value = 180;
        }
    }
</script>

<script th:inline="javascript">
    console.log("MODEL SCRIPT LOADED");

    const brandModelPairs = /*[[${brandModelPairs}]]*/ [];

    function updateModelsForCurrentRow(brandInput) {
        const currentRow = brandInput.closest('.item-row');
        const modelInput = currentRow.querySelector('.model-input');

        if (modelInput) {
            filterModelsForCurrentRow(modelInput);
        }
    }

    function filterModelsForCurrentRow(modelInput) {
        const currentRow = modelInput.closest('.item-row');
        const brandInput = currentRow.querySelector('.brand-input');
        const selectedBrand = brandInput ? brandInput.value.trim().toLowerCase() : '';
        const modelDatalist = document.getElementById('modelSuggestions');

        modelDatalist.innerHTML = '';

        if (!selectedBrand) return;

        const uniqueModels = new Set();

        brandModelPairs.forEach(pair => {
            const brand = pair[0];
            const model = pair[1];

            if (brand && brand.toLowerCase() === selectedBrand) {
                if (model && !uniqueModels.has(model.toLowerCase())) {
                    uniqueModels.add(model.toLowerCase());

                    const option = document.createElement('option');
                    option.value = model;
                    modelDatalist.appendChild(option);
                }
            }
        });
    }
    function autoFillByBarcode(barcodeInput) {
        const barcodeValue = barcodeInput.value.trim();
        if (!barcodeValue) return;

        // 1. Търсим продукт с такъв баркод в масива
        const foundProduct = allProducts.find(p => p.barcode && p.barcode.trim() === barcodeValue);

        // 2. Ако намерим съвпадение, попълваме останалите полета на същия ред
        if (foundProduct) {
            const currentRow = barcodeInput.closest('.item-row');

            // Попълваме текстовите полета
            if (foundProduct.brand) currentRow.querySelector('input[name$=".brand"]').value = foundProduct.brand;
            if (foundProduct.model) currentRow.querySelector('input[name$=".model"]').value = foundProduct.model;
            if (foundProduct.sizeOrDiameter) currentRow.querySelector('input[name$=".sizeOrDiameter"]').value = foundProduct.sizeOrDiameter;

            // Попълваме диоптрите безопасно (ако съществуват за продукта)
            if (foundProduct.sph !== null) currentRow.querySelector('input[name$=".sph"]').value = foundProduct.sph;
            if (foundProduct.cyl !== null) currentRow.querySelector('input[name$=".cyl"]').value = foundProduct.cyl;
            if (foundProduct.addPower !== null) currentRow.querySelector('input[name$=".addPower"]').value = foundProduct.addPower;
            if (foundProduct.prism !== null) currentRow.querySelector('input[name$=".prism"]').value = foundProduct.prism;

            // Попълваме цената
            if (foundProduct.retailPrice !== null) {
                const priceInput = currentRow.querySelector('input[name$=".priceAtPurchase"]');
                priceInput.value = foundProduct.retailPrice;

                // Провокираме преизчисляване на тоталите, понеже цената се промени динамично
                recalcBaseTotal();
            }

            // Автоматично сменяме категорията в падащото меню, ако съвпада
            if (foundProduct.category) {
                const categorySelect = currentRow.querySelector('.category-trigger');
                categorySelect.value = foundProduct.category;
                toggleFieldsByCategory(categorySelect); // Задействаме скриването/показването на диоптрите спрямо категорията
            }
        }
    }
</script>


</body>
</html>
