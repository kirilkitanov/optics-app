<!DOCTYPE html>
<html lang="bg" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нова доставка</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class="app-wrapper">

    <div th:replace="~{header :: header-fragment}"></div>

    <div class="main-container">

        <div th:replace="~{sidebar :: sidebar-fragment}"></div>

        <section class="content new-order-page delivery-page">

            <div class="content-header">
                <h1 class="page-title-blue"
                    th:text="${deliveryId != null
        ? 'Редакция на доставка – фактура № ' + createDeliveryRequest.invoiceNumber
        : 'Нова доставка'}">
                    Нова доставка
                </h1>
                <div style="display: flex; gap: 10px;">
                    <a th:if="${deliveryId != null}"
                       th:href="@{/deliveries/{id}/export(id=${deliveryId})}"
                       class="btn-new-order">
                        Експорт Excel
                    </a>

                    <a th:href="@{/deliveries}" class="btn-new-order">
                        Назад
                    </a>
                </div>
            </div>

            <div class="table-container">

                <div id="productErrorMessage"
                     class="product-error"
                     hidden>
                </div>

                    <form th:action="${deliveryId != null
                        ? '/deliveries/' + deliveryId + '/edit'
                        : '/deliveries/new'}"
                          th:object="${createDeliveryRequest}"
                          method="POST"
                          enctype="multipart/form-data"
                          novalidate
                          onsubmit="return handleDeliveryFormSubmit(event);">

                    <div class="delivery-supplier-fields">

                        <div class="form-group">
                            <label class="form-label" for="supplierId">
                                Доставчик
                            </label>

                            <select id="supplierId"
                                    name="supplierId"
                                    class="status-select"
                                    required>
                                <option value="">-- Избери доставчик --</option>

                                <option th:each="supplier : ${suppliers}"
                                        th:value="${supplier.id}"
                                        th:text="${supplier.companyName}"
                                        th:selected="${createDeliveryRequest.supplierId == supplier.id}">
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="invoiceNumber">
                                Номер на фактура
                            </label>

                            <input type="text"
                                   id="invoiceNumber"
                                   name="invoiceNumber"
                                   class="status-select"
                                   maxlength="100"
                                   required
                                   th:value="${createDeliveryRequest.invoiceNumber}">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="invoiceDate">
                                Дата на фактура
                            </label>

                            <input type="date"
                                   id="invoiceDate"
                                   name="invoiceDate"
                                   class="status-select"
                                   required
                                   th:value="${createDeliveryRequest.invoiceDate != null
                                   ? #temporals.format(createDeliveryRequest.invoiceDate, 'yyyy-MM-dd') : ''}">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="deliveryNote">
                                Бележка
                            </label>

                            <input type="text"
                                   id="deliveryNote"
                                   name="note"
                                   class="status-select order-note-input"
                                   maxlength="500"
                                   placeholder="Бележка към доставката..."
                                   th:value="${createDeliveryRequest.note}">
                        </div>

                        <div class="form-group">
                            <label class="form-label">&nbsp;</label>

                            <button type="submit"
                                    name="action"
                                    value="preview"
                                    formaction="/deliveries/import"
                                    formmethod="post"
                                    formenctype="multipart/form-data"
                                    formnovalidate
                                    class="btn-new-order">
                                Импорт от Excel
                            </button>
                        </div>

                    </div>

                    <h3 class="section-title">Продукти в доставката</h3>

                    <div id="prescriptionItems">

                        <div class="item-row"
                             th:each="item, itemStat : ${createDeliveryRequest.items}">

                            <div class="item-fields">

                                <div class="item-field">
                                    <label><span class="item-number"></span>Категория</label>
                                    <select th:name="'items[' + ${itemStat.index} + '].category'"
                                            class="status-select category-trigger"
                                            onchange="toggleFieldsByCategory(this); checkProductByCharacteristics(this)">
                                        <option value="LENS"
                                                th:selected="${item.category == T(com.opticsappbg.opticsapp.product.model.ProductCategory).LENS}">
                                            Стъкла
                                        </option>
                                        <option value="FRAME"
                                                th:selected="${item.category == T(com.opticsappbg.opticsapp.product.model.ProductCategory).FRAME}">
                                            Рамка
                                        </option>
                                        <option value="SUNGLASSES"
                                                th:selected="${item.category == T(com.opticsappbg.opticsapp.product.model.ProductCategory).SUNGLASSES}">
                                            Слънчеви
                                        </option>
                                        <option value="CONTACT_LENS"
                                                th:selected="${item.category == T(com.opticsappbg.opticsapp.product.model.ProductCategory).CONTACT_LENS}">
                                            Контактни лещи
                                        </option>
                                        <option value="ACCESSORY"
                                                th:selected="${item.category == T(com.opticsappbg.opticsapp.product.model.ProductCategory).ACCESSORY}">
                                            Аксесоар
                                        </option>
                                    </select>
                                </div>

                                <div class="item-field">
                                    <label>Баркод</label>
                                    <input type="text"
                                           th:name="'items[' + ${itemStat.index} + '].barcode'"
                                           th:value="${item.barcode}"
                                           class="status-select barcode-input"
                                           placeholder="Сканирай"
                                           onchange="autoFillByBarcode(this)"
                                           onkeydown="handleBarcodeKeydown(event, this)">

                                    <input type="hidden"
                                           th:name="'items[' + ${itemStat.index} + '].productId'"
                                           th:value="${item.productId}"
                                           class="product-id-input">
                                </div>

                                <div class="item-field">
                                    <label>Бранд</label>
                                    <input type="text"
                                           th:name="'items[' + ${itemStat.index} + '].brand'"
                                           th:value="${item.brand}"
                                           class="status-select brand-input"
                                           list="brandSuggestions"
                                           oninput="updateModelsForCurrentRow(this)"
                                           onchange="checkProductByCharacteristics(this)"
                                           required>
                                </div>

                                <div class="item-field">
                                    <label>Модел</label>
                                    <input type="text"
                                           th:name="'items[' + ${itemStat.index} + '].model'"
                                           th:value="${item.model}"
                                           class="status-select model-input"
                                           list="modelSuggestions"
                                           onfocus="filterModelsForCurrentRow(this)"
                                           onchange="checkProductByCharacteristics(this)">
                                </div>

                                <div class="item-field">
                                    <label>Размер / Ф</label>
                                    <input type="text"
                                           th:name="'items[' + ${itemStat.index} + '].sizeOrDiameter'"
                                           th:value="${item.sizeOrDiameter}"
                                           class="status-select"
                                           onchange="checkProductByCharacteristics(this)">
                                </div>

                            </div>

                            <div class="diopter-section">
                                <div class="item-fields">

                                    <div class="item-field">
                                        <label>SPH</label>
                                        <input type="number" lang="en" step="0.25"
                                               th:name="'items[' + ${itemStat.index} + '].sph'"
                                               th:value="${item.sph != null ? item.sph : 0}"
                                               class="status-select"
                                               onchange="checkProductByCharacteristics(this)">
                                    </div>

                                    <div class="item-field">
                                        <label>CYL</label>
                                        <input type="number" lang="en" step="0.25"
                                               th:name="'items[' + ${itemStat.index} + '].cyl'"
                                               th:value="${item.cyl != null ? item.cyl : 0}"
                                               class="status-select"
                                               onchange="checkProductByCharacteristics(this)">
                                    </div>

                                    <div class="item-field">
                                        <label>ADD</label>
                                        <input type="number" lang="en" step="0.25"
                                               th:name="'items[' + ${itemStat.index} + '].addPower'"
                                               th:value="${item.addPower != null ? item.addPower : 0}"
                                               class="status-select"
                                               onchange="checkProductByCharacteristics(this)">
                                    </div>

                                    <div class="item-field">
                                        <label>PRISM</label>
                                        <input type="number" lang="en" step="0.25"
                                               th:name="'items[' + ${itemStat.index} + '].prism'"
                                               th:value="${item.prism != null ? item.prism : 0}"
                                               class="status-select"
                                               onchange="checkProductByCharacteristics(this)">
                                    </div>

                                </div>
                            </div>

                            <div class="item-field">
                                <label>Колич.</label>
                                <input type="number"
                                       min="1"
                                       th:name="'items[' + ${itemStat.index} + '].quantity'"
                                       th:value="${item.quantity != null ? item.quantity : 1}"
                                       class="status-select">
                            </div>

                            <div class="item-field">
                                <label>Дост. цена</label>
                                <input type="number"
                                       lang="en"
                                       min="0"
                                       step="0.01"
                                       th:name="'items[' + ${itemStat.index} + '].purchasePriceAtDelivery'"
                                       th:value="${item.purchasePriceAtDelivery}"
                                       class="status-select purchase-price-input"
                                       required>
                            </div>

                            <div class="item-actions">
                                <button type="button"
                                        onclick="removeRow(this)"
                                        class="btn-remove-row">
                                    X
                                </button>
                            </div>

                        </div>

                    </div>

                    <datalist id="brandSuggestions">
                        <option th:each="b : ${brands}" th:value="${b}"></option>
                    </datalist>

                    <datalist id="modelSuggestions"></datalist>

                    <div id="productSelectionModal" class="modal" style="display:none;">
                        <div class="modal-content">
                            <h3>Избери продукт</h3>

                            <div id="productSelectionList"></div>

                            <div style="margin-top:15px;">
                                <button type="button"
                                        class="btn-new-order"
                                        onclick="closeProductSelectionModal()">
                                    Отказ
                                </button>
                            </div>
                        </div>
                    </div>

                    <button type="button" id="addRowBtn" class="btn-new-order">
                        Добави продукт
                    </button>

                    <div class="financial-box">

                        <div class="financial-group">
                            <label>Общо</label>
                            <input type="number"
                                   lang="en"
                                   step="0.01"
                                   name="totalBeforeDiscount"
                                   readonly
                                   value="0">
                        </div>

                        <div class="financial-group">
                            <label>Отстъпка / надценка %</label>
                            <input type="number"
                                   lang="en"
                                   step="0.01"
                                   name="discountPercentage"
                                   th:value="${createDeliveryRequest.discountPercentage != null ? createDeliveryRequest.discountPercentage : 0}">
                        </div>

                        <div class="financial-group">
                            <label>Крайна сума по фактура</label>
                            <input type="number"
                                   lang="en"
                                   step="0.01"
                                   name="totalAmount"
                                   th:value="${createDeliveryRequest.totalAmount}">
                        </div>
                    </div>

                    <div class="form-actions delivery-form-actions">

                        <div class="financial-group">
                            <label>
                                <input type="checkbox"
                                       th:field="*{updateProductPurchasePrices}">
                                Обнови текущите доставни цени на продуктите според тази фактура
                            </label>
                        </div>

                        <button type="submit" class="btn-new-order">Запази</button>

                    </div>

                </form>

            </div>

        </section>
    </div>
</div>

<script th:inline="javascript">
    const brandModelPairs = /*[[${brandModelPairs}]]*/ [];
    function updateItemNumbers() {
        document.querySelectorAll('#prescriptionItems .item-row')
            .forEach((row, index) => {
                const number = row.querySelector('.item-number');
                if (number) {
                    number.textContent = `${index + 1}. `;
                }
            });
    }

    function reindexRows() {
        document.querySelectorAll('#prescriptionItems .item-row')
            .forEach((row, index) => {
                row.querySelectorAll('input, select').forEach(el => {
                    if (el.name) {
                        const field = el.name.split('.').pop();
                        el.name = `items[${index}].${field}`;
                    }
                });
            });

        updateItemNumbers();
    }

    document.getElementById('addRowBtn').addEventListener('click', function () {
        const container = document.getElementById('prescriptionItems');
        const rows = container.querySelectorAll('.item-row');

        if (rows.length === 0) return;

        const newRow = rows[0].cloneNode(true);

        newRow.querySelectorAll('input, select').forEach(el => {
            if (el.tagName === 'INPUT') {
                if (el.name.endsWith('.quantity')) {
                    el.value = '1';
                } else if (
                    el.name.endsWith('.sph') ||
                    el.name.endsWith('.cyl') ||
                    el.name.endsWith('.addPower') ||
                    el.name.endsWith('.prism')
                ) {
                    el.value = '0';
                } else {
                    el.value = '';
                }
            }

            if (el.tagName === 'SELECT') {
                el.selectedIndex = 0;
            }
        });

        container.appendChild(newRow);

        toggleFieldsByCategory(newRow.querySelector('.category-trigger'));
        reindexRows();
        recalcBaseTotal();
    });

    function removeRow(button) {
        const container = document.getElementById('prescriptionItems');
        const rows = container.querySelectorAll('.item-row');

        if (rows.length <= 1) {
            showProductError('Доставката трябва да съдържа поне един продукт!');
            return;
        }

        button.closest('.item-row').remove();

        reindexRows();
        recalcBaseTotal();
    }

    function handleDeliveryFormSubmit(event) {
        const submitter = event.submitter;

        if (submitter && submitter.value === 'preview') {
            const supplierId = document.getElementById('supplierId').value;
            const invoiceNumber = document.getElementById('invoiceNumber').value.trim();
            const invoiceDate = document.getElementById('invoiceDate').value;

            if (!supplierId) {
                showProductError('Моля, изберете доставчик.');
                return false;
            }

            if (!invoiceNumber) {
                showProductError('Моля, въведете номер на фактура.');
                return false;
            }

            if (!invoiceDate) {
                showProductError('Моля, въведете дата на фактура.');
                return false;
            }

            return true;
        }

        return validateBrands();
    }

    function validateBrands() {
        const supplierId = document.getElementById('supplierId').value;
        const invoiceNumber = document.getElementById('invoiceNumber').value.trim();
        const invoiceDate = document.getElementById('invoiceDate').value;

        if (!supplierId) {
            showProductError('Моля, изберете доставчик.');
            document.getElementById('supplierId').focus();
            return false;
        }

        if (!invoiceNumber) {
            showProductError('Моля, въведете номер на фактура.');
            document.getElementById('invoiceNumber').focus();
            return false;
        }

        if (!invoiceDate) {
            showProductError('Моля, въведете дата на фактура.');
            document.getElementById('invoiceDate').focus();
            return false;
        }

        const rows = document.querySelectorAll('#prescriptionItems .item-row');

        for (let i = 0; i < rows.length; i++) {
            const brandInput = rows[i].querySelector('.brand-input');

            if (!brandInput || !brandInput.value.trim()) {
                showProductError(`Моля, въведете бранд за продукт №${i + 1}.`);
                brandInput?.focus();
                return false;
            }
        }

        return true;
    }

    function getBaseTotal() {
        return parseFloat(
            document.querySelector('input[name="totalBeforeDiscount"]').value || 0
        );
    }

    function setTotal(value) {
        document.querySelector('input[name="totalAmount"]').value = value.toFixed(2);
    }

    function setDiscount(value) {
        document.querySelector('input[name="discountPercentage"]').value = value.toFixed(2);
    }

    function recalcBaseTotal() {
        let baseTotal = 0;

        document.querySelectorAll('#prescriptionItems .item-row').forEach(row => {
            const quantity = parseFloat(
                row.querySelector('input[name$=".quantity"]')?.value || 0
            );

            const price = parseFloat(
                row.querySelector('input[name$=".purchasePriceAtDelivery"]')?.value || 0
            );

            baseTotal += quantity * price;
        });

        document.querySelector('input[name="totalBeforeDiscount"]').value =
            baseTotal.toFixed(2);

        const discount = parseFloat(
            document.querySelector('input[name="discountPercentage"]').value || 0
        );

        setTotal(baseTotal - (baseTotal * discount / 100));

        return baseTotal;
    }

    document.querySelector('input[name="discountPercentage"]')
        .addEventListener('input', function () {
            const base = getBaseTotal();
            const discount = parseFloat(this.value || 0);

            setTotal(base - (base * discount / 100));
        });

    document.querySelector('input[name="totalAmount"]')
        .addEventListener('input', function () {
            const base = getBaseTotal();
            const total = parseFloat(this.value || 0);

            if (base <= 0) {
                setDiscount(0);
                return;
            }

            setDiscount(((base - total) / base) * 100);
        });

    document.addEventListener('input', function (event) {
        if (
            event.target.name?.endsWith('.quantity') ||
            event.target.name?.endsWith('.purchasePriceAtDelivery')
        ) {
            recalcBaseTotal();
        }
    });

    function showProductError(message) {
        const errorBox = document.getElementById('productErrorMessage');
        errorBox.textContent = message;
        errorBox.hidden = false;
    }

    function toggleFieldsByCategory(selectElement) {
        const row = selectElement.closest('.item-row');
        const diopterSection = row.querySelector('.diopter-section');

        if (!diopterSection) return;

        if (
            selectElement.value === 'LENS' ||
            selectElement.value === 'CONTACT_LENS'
        ) {
            diopterSection.classList.remove('hidden-field');
        } else {
            diopterSection.classList.add('hidden-field');
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        updateItemNumbers();

        document.querySelectorAll('.category-trigger').forEach(select => {
            toggleFieldsByCategory(select);
        });

        recalcBaseTotal();
    });

    function handleBarcodeKeydown(event, input) {
        if (event.key === 'Enter') {
            event.preventDefault();
            autoFillByBarcode(input);
        }
    }

    function normalizeOpticalValue(value) {
        if (value === null || value === undefined || value.trim() === '') {
            return '0';
        }

        return value;
    }

    function getProductCharacteristics(row) {
        return {
            category: row.querySelector('.category-trigger')?.value || '',
            brand: row.querySelector('.brand-input')?.value.trim() || '',
            model: row.querySelector('.model-input')?.value.trim() || '',
            sizeOrDiameter:
                row.querySelector('input[name$=".sizeOrDiameter"]')?.value.trim() || '',
            sph: normalizeOpticalValue(
                row.querySelector('input[name$=".sph"]')?.value
            ),
            cyl: normalizeOpticalValue(
                row.querySelector('input[name$=".cyl"]')?.value
            ),
            addPower: normalizeOpticalValue(
                row.querySelector('input[name$=".addPower"]')?.value
            ),
            prism: normalizeOpticalValue(
                row.querySelector('input[name$=".prism"]')?.value
            )
        };
    }

    async function lookupProductsByCharacteristics(row) {
        const characteristics = getProductCharacteristics(row);

        if (!characteristics.category) {
            return [];
        }

        const params = new URLSearchParams();

        params.append('category', characteristics.category);
        params.append('brand', characteristics.brand);
        params.append('model', characteristics.model);
        params.append('sph', characteristics.sph);
        params.append('cyl', characteristics.cyl);
        params.append('addPower', characteristics.addPower);
        params.append('prism', characteristics.prism);
        params.append('sizeOrDiameter', characteristics.sizeOrDiameter);

        try {
            const response = await fetch(`/products/lookup?${params.toString()}`);

            if (!response.ok) {
                throw new Error(`Lookup error: ${response.status}`);
            }

            return await response.json();

        } catch (error) {
            console.error('Грешка при търсене на продукт:', error);
            return [];
        }
    }

    async function checkProductByCharacteristics(inputElement) {
        const row = inputElement.closest('.item-row');

        if (!row) {
            return;
        }

        const productIdInput = row.querySelector('.product-id-input');
        const barcodeInput = row.querySelector('.barcode-input');

        // Запазваме информация дали преди промяната е бил избран продукт.
        const hadSelectedProduct = productIdInput?.value !== '';

        if (productIdInput) {
            productIdInput.value = '';
        }

        const products = await lookupProductsByCharacteristics(row);

        if (!barcodeInput) {
            return;
        }

        // Няма намерен продукт — оставяме реда за създаване на нов.
        if (products.length === 0) {
            if (hadSelectedProduct) {
                barcodeInput.value = '';

                const priceInput = row.querySelector('.purchase-price-input');
                if (priceInput) {
                    priceInput.value = '';
                }

                recalcBaseTotal();
            }

            return;
        }

        // Намерен е точно един продукт.
        if (products.length === 1) {
            selectProductForDelivery(row, products[0]);
            return;
        }

        // Намерени са няколко продукта — потребителят избира.
        openProductSelectionModal(row, products);
    }

    function selectProductForDelivery(row, product) {
        const barcodeInput = row.querySelector('.barcode-input');
        const productIdInput = row.querySelector('.product-id-input');
        const priceInput = row.querySelector('.purchase-price-input');

        if (barcodeInput) {
            barcodeInput.value = product.barcode || '';
        }

        if (productIdInput) {
            productIdInput.value = product.id;
        }

        // Зареждаме текущата доставна цена, но тя остава редактируема.
        if (priceInput && product.purchasePrice != null) {
            priceInput.value = Number(product.purchasePrice).toFixed(2);
            recalcBaseTotal();
        }

        closeProductSelectionModal();
    }

    function openProductSelectionModal(row, products) {
        const modal = document.getElementById('productSelectionModal');
        const list = document.getElementById('productSelectionList');

        if (!modal || !list) {
            showProductError('Липсва прозорецът за избор на продукт.');
            return;
        }

        list.innerHTML = '';

        products.forEach(product => {
            const button = document.createElement('button');

            button.type = 'button';
            button.className = 'product-selection-item';
            button.textContent = `Баркод: ${product.barcode || 'Без баркод'}`;

            button.addEventListener('click', function () {
                selectProductForDelivery(row, product);
            });

            list.appendChild(button);
        });

        modal.style.display = 'flex';
    }

    function closeProductSelectionModal() {
        const modal = document.getElementById('productSelectionModal');

        if (modal) {
            modal.style.display = 'none';
        }
    }

    function updateModelsForCurrentRow(brandInput) {
        const currentRow = brandInput.closest('.item-row');
        const modelInput = currentRow.querySelector('.model-input');

        if (modelInput) {
            filterModelsForCurrentRow(modelInput);
        }
    }

    function filterModelsForCurrentRow(modelInput) {
        const currentRow = modelInput.closest('.item-row');
        const brandInput = currentRow.querySelector('.brand-input');

        const selectedBrand = brandInput
            ? brandInput.value.trim().toLowerCase()
            : '';

        const modelDatalist = document.getElementById('modelSuggestions');

        modelDatalist.innerHTML = '';

        if (!selectedBrand) {
            return;
        }

        const uniqueModels = new Set();

        brandModelPairs.forEach(pair => {
            const brand = pair[0];
            const model = pair[1];

            if (brand && brand.toLowerCase() === selectedBrand) {
                if (model && !uniqueModels.has(model.toLowerCase())) {
                    uniqueModels.add(model.toLowerCase());

                    const option = document.createElement('option');
                    option.value = model;

                    modelDatalist.appendChild(option);
                }
            }
        });
    }

    async function autoFillByBarcode(input) {
        const barcode = input.value.trim();

        if (!barcode) return;

        const row = input.closest('.item-row');

        try {
            const response = await fetch(
                `/products/lookup-by-barcode?barcode=${encodeURIComponent(barcode)}`
            );

            if (response.status === 404) {
                row.querySelector('.product-id-input').value = '';
                return;
            }

            if (!response.ok) {
                showProductError('Грешка при търсене на продукта по баркод.');
                return;
            }

            const product = await response.json();

            row.querySelector('.product-id-input').value = product.id;
            row.querySelector('.category-trigger').value = product.category;
            row.querySelector('.brand-input').value = product.brand || '';
            row.querySelector('.model-input').value = product.model || '';

            row.querySelector('input[name$=".sizeOrDiameter"]').value =
                product.sizeOrDiameter || '';

            row.querySelector('input[name$=".sph"]').value =
                product.sph ?? 0;

            row.querySelector('input[name$=".cyl"]').value =
                product.cyl ?? 0;

            row.querySelector('input[name$=".addPower"]').value =
                product.addPower ?? 0;

            row.querySelector('input[name$=".prism"]').value =
                product.prism ?? 0;

            if (product.purchasePrice != null) {
                row.querySelector('.purchase-price-input').value =
                    Number(product.purchasePrice).toFixed(2);
            }

            toggleFieldsByCategory(row.querySelector('.category-trigger'));
            recalcBaseTotal();

        } catch (error) {
            console.error(error);
            showProductError('Грешка при търсене на продукта по баркод.');
        }
    }
</script>

</body>
</html>
