<!DOCTYPE html>
<html lang="bg" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Начало</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="app-wrapper">

    <!-- HEADER -->
    <div th:replace="~{header :: header-fragment}"></div>

    <!-- MAIN LAYOUT -->
    <div class="main-container">

        <!-- SIDEBAR -->
        <div th:replace="~{sidebar :: sidebar-fragment}"></div>

        <!-- CONTENT -->
        <section class="content">

            <div class="content-header">
                <h1 class="page-title-blue">Чакащи поръчки</h1>
                <a th:href="@{/orders/new}" class="btn-new-order">Нова поръчка</a>
            </div>

            <div class="table-container" th:if="${not #lists.isEmpty(orders)}">
                <table>
                    <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Номер</th>
                        <th>Клиент</th>
                        <th>Телефон</th>
                        <th>Сума</th>
                        <th>Статус</th>
                        <th>Промяна на статус</th>
                        <th>Редакция</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${#temporals.format(order.createdOn, 'dd.MM.yyyy HH:mm')}"></td>

                        <td th:text="${order.orderNumber}"></td>

                        <td th:text="${order.customer.fullName}"></td>

                        <td th:text="${order.customer.phone}"></td>

                        <td th:text="${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT') + ' EUR.'}"></td>

                        <td th:text="${order.status.displayName}"></td>

                        <td>
                            <form th:action="@{/orders/{id}/update-status(id=${order.id})}"
                                  method="post">

                                <select name="status"
                                        class="status-select"
                                        onchange="this.form.submit()">

                                    <option th:each="statusOpt : ${T(com.opticsappbg.opticsapp.order.model.OrderStatus).values()}"
                                            th:value="${statusOpt}"
                                            th:text="${statusOpt.displayName}"
                                            th:selected="${statusOpt == order.status}">
                                    </option>

                                </select>
                            </form>
                        </td>

                        <td>
                            <a th:href="@{/orders/{id}/edit(id=${order.id})}"
                               class="btn-new-order">
                                Редакция
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="no-orders-container" th:if="${#lists.isEmpty(orders)}">
                Няма намерени чакащи поръчки.
            </div>

        </section>
    </div>
</div>

</body>
</html>
