
<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Импорт от Excel</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class="app-wrapper">

    <div th:replace="~{header :: header-fragment}"></div>

    <div class="main-container">

        <div th:replace="~{sidebar :: sidebar-fragment}"></div>

        <section class="content">

            <div class="content-header">
                <h1 class="page-title-blue">Импорт от Excel</h1>
                <a th:href="@{/products}" class="btn-new-order">
                    Назад
                </a>
            </div>

            <div class="table-container" style="padding: 20px;">

                <h2 style="color: #1f4e79; font-size: 17px; margin-bottom: 10px;">
                    Качване на Excel файл
                </h2>

                <p style="color: #666; font-size: 14px; margin-bottom: 20px;">
                    Избери файл във формат .xlsx, за да добавиш нови
                    продукти или да обновиш съществуващи.
                </p>

                <form th:action="@{/products/import}"
                      method="post"
                      enctype="multipart/form-data">

                    <div style="margin-bottom: 16px;">
                        <label for="excelFile"
                               style="display: block; color: #1f4e79;
                                      font-size: 14px; font-weight: bold;
                                      margin-bottom: 8px;">
                            Excel файл (.xlsx)
                        </label>

                        <input type="file"
                               id="excelFile"
                               name="file"
                               accept=".xlsx"
                               required
                               style="max-width: 100%; padding: 8px;
                                      border: 1px solid #ccc; border-radius: 6px;">
                    </div>

                    <button type="submit" class="btn-new-order">
                        Импортирай
                    </button>
                </form>

                <div th:if="${importError != null}"
                     class="product-error"
                     style="margin-top: 20px;"
                     role="alert"
                     th:text="${importError}">
                </div>

                <div th:if="${importResult != null}"
                     style="margin-top: 24px;">

                    <h3 style="color: #1f4e79; font-size: 16px;
                               margin-bottom: 12px;">
                        Резултат от импорта
                    </h3>

                    <p style="margin-bottom: 8px;">
                        Добавени:
                        <strong th:text="${importResult.added}">0</strong>
                    </p>

                    <p style="margin-bottom: 8px;">
                        Обновени:
                        <strong th:text="${importResult.updated}">0</strong>
                    </p>

                    <p style="margin-bottom: 12px;">
                        Пропуснати:
                        <strong th:text="${importResult.skipped}">0</strong>
                    </p>

                    <div th:if="${!#lists.isEmpty(importResult.errors)}">
                        <h4 style="color: #842029; margin-bottom: 8px;">
                            Проблеми при обработката
                        </h4>

                        <ul style="padding-left: 22px;">
                            <li th:each="error : ${importResult.errors}"
                                th:text="${error}"
                                style="margin-bottom: 6px;">
                            </li>
                        </ul>
                    </div>

                </div>

            </div>

        </section>
    </div>
</div>

</body>
</html>
